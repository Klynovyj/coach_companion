<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Trainer-Bewertung</title>
<style>
  :root {
    --green: #138a54;
    --bg: #f3f6f4;
    --card: #ffffff;
    --text: #1b2420;
    --muted: #5d6b64;
    --line: #dfe6e2;
    --star: #f2b233;
    --star-off: #cfd8d3;
    --danger: #b3261e;
    --chip: #e3ece7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513;
      --card: #1a211e;
      --text: #e8efeb;
      --muted: #9aa8a1;
      --line: #2b3530;
      --star-off: #3b4741;
      --chip: #24302a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--green); color: #fff; padding: 18px 16px 22px; }
  header .team { font-size: 13px; opacity: .85; letter-spacing: .04em; text-transform: uppercase; }
  header h1 { margin: 4px 0 2px; font-size: 21px; line-height: 1.25; }
  header .sub { font-size: 14px; opacity: .9; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 96px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; }
  .chips button { flex: none; border: 1px solid var(--line); background: var(--chip); color: var(--text);
    border-radius: 999px; padding: 8px 12px; font: 14px system-ui, sans-serif; cursor: pointer; }
  .chips button.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 14px 12px; margin: 12px 0; }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .stars { display: flex; gap: 2px; }
  .stars button { background: none; border: 0; padding: 4px; font-size: 30px; line-height: 1;
    color: var(--star-off); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .stars button.on { color: var(--star); }
  .stars.small button { font-size: 26px; padding: 3px; }
  textarea { width: 100%; min-height: 96px; margin-top: 8px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--green);
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--green); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--line); }
  .bar button, .btn { display: block; width: 100%; max-width: 640px; margin: 0 auto; padding: 14px;
    border: 0; border-radius: 12px; background: var(--green); color: #fff; font: 600 17px system-ui, sans-serif; cursor: pointer; }
  .bar button:disabled { opacity: .6; }
  .btn.ghost { background: transparent; color: var(--green); border: 1px solid var(--green); margin-top: 10px; }
  .center { text-align: center; padding: 22px 8px; }
  .big { font-size: 42px; }
  .err { color: var(--danger); font-size: 14px; margin-top: 8px; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: right; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 4px 6px; }
  th:first-child { text-align: left; }
  td { padding: 7px 4px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  td:first-child { text-align: left; white-space: normal; }
  td .n { color: var(--muted); font-size: 12px; }
  .kpis { display: flex; gap: 10px; }
  .kpi { flex: 1; background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
  .kpi b { display: block; font-size: 24px; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .quote { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 8px 0; }
  .quote .by { font-size: 13px; color: var(--muted); }
  .winner { font-size: 20px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="team" id="team">&nbsp;</div>
  <h1 id="title">Trainer-Bewertung</h1>
  <div class="sub" id="sub">Wird geladen …</div>
</header>
<main>
  <div class="chips" id="chips"></div>
  <div id="main"></div>
</main>
<div class="bar" id="bar" hidden><button id="send">Speichern</button><div class="err" id="err"></div></div>

<script>
const SUPABASE_URL = 'https://ujrpsqfekmmjxypsdyza.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqcnBzcWZla21tanh5cHNkeXphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MjQwNDIsImV4cCI6MjEwODQwMDA0Mn0.37Ht9fqrnmIqS23qNNM81zRr-zPFc8K6pjiUMmUmvFg';

const token = new URLSearchParams(location.hash.slice(1)).get('t') ||
  new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
let info = null;     // {name, team, rounds}
let sel = null;      // gewählte match_id
let detail = null;   // Antwort von coach_rating_detail
let editing = false;
let form = { stars: {}, match_stars: null, note: '', abstained: false };

async function rpc(fn, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtDate(iso, withTime) {
  if (!iso) return '';
  const opts = { weekday: 'short', day: '2-digit', month: '2-digit' };
  if (withTime) Object.assign(opts, { hour: '2-digit', minute: '2-digit' });
  return new Date(iso).toLocaleString('de-DE', opts);
}
const f1 = (x) => (x == null ? '–' : Number(x).toFixed(1).replace('.', ','));

function players() {
  const ps = (detail?.round?.players || []).slice();
  ps.sort((a, b) => (a.number ?? 999) - (b.number ?? 999) || String(a.name).localeCompare(String(b.name)));
  return ps;
}
function nameOf(id) {
  return (detail?.round?.players || []).find((p) => p.id === id)?.name || 'Unbekannt';
}
function starsHtml(key, value, small) {
  let h = `<div class="stars${small ? ' small' : ''}" data-key="${esc(key)}">`;
  for (let i = 1; i <= 5; i++) h += `<button type="button" data-v="${i}" class="${value >= i ? 'on' : ''}" aria-label="${i} Sterne">★</button>`;
  return h + '</div>';
}
function staticStars(v) {
  const n = Math.round(v || 0);
  return '<span style="color:var(--star)">' + '★'.repeat(n) + '</span><span style="color:var(--star-off)">' + '★'.repeat(5 - n) + '</span>';
}

function message(icon, title, text) {
  $('bar').hidden = true;
  $('main').innerHTML = `<div class="card center"><div class="big">${icon}</div><h2>${esc(title)}</h2><p class="hint">${esc(text)}</p></div>`;
}

function renderChips() {
  const rs = info?.rounds || [];
  if (rs.length < 2) { $('chips').innerHTML = ''; return; }
  $('chips').innerHTML = rs.map((r) =>
    `<button data-m="${esc(r.match_id)}" class="${r.match_id === sel ? 'on' : ''}">${r.open ? '🟢 ' : ''}${esc(fmtDate(r.match_date))} · ${esc(r.title)}</button>`).join('');
  $('chips').querySelectorAll('button').forEach((b) => (b.onclick = () => select(b.dataset.m)));
}

function setHeader() {
  $('team').textContent = info?.team || '';
  const r = detail?.round;
  $('title').textContent = r?.title || 'Trainer-Bewertung';
  if (!r) { $('sub').textContent = info?.name ? `Hallo ${info.name}!` : ''; return; }
  $('sub').textContent = r.open
    ? `Hallo ${info.name || ''}! Bewerten bis ${fmtDate(r.closes_at, true)} Uhr`
    : `Spiel vom ${fmtDate(r.match_date)} · Bewertung beendet`;
}

function resultsHtml() {
  const res = detail.results;
  if (!res) return '';
  const ps = players();
  let h = '';
  const motm = res.motm || [];
  h += `<div class="card"><h2>🏆 Spieler des Spiels <span class="hint">(Mannschaft)</span></h2>`;
  if (!motm.length) h += '<p class="hint">Noch keine Stimmen.</p>';
  else {
    const top = motm[0].votes;
    h += motm.slice(0, 5).map((m) => `<div class="row"><span class="${m.votes === top ? 'winner' : ''}">${esc(nameOf(m.id))}</span><span>${m.votes} ${m.votes === 1 ? 'Stimme' : 'Stimmen'}</span></div>`).join('');
  }
  h += `<p class="hint" style="margin-top:8px">${res.voters} von ${ps.length} Spielern haben abgestimmt.</p></div>`;

  h += `<div class="card"><h2>Spielnote</h2><div class="kpis">
    <div class="kpi"><b>${f1(res.trainer_match_avg)}</b><span>Trainer (${res.trainer_match_n})</span></div>
    <div class="kpi"><b>${f1(res.team_match_avg)}</b><span>Mannschaft (${res.team_match_n})</span></div></div></div>`;

  const ta = res.trainer_avg || {}, pa = res.team_avg || {};
  const rows = ps.filter((p) => ta[p.id] || pa[p.id])
    .sort((a, b) => (ta[b.id]?.avg ?? -1) - (ta[a.id]?.avg ?? -1) || (pa[b.id]?.avg ?? -1) - (pa[a.id]?.avg ?? -1));
  h += `<div class="card"><h2>Spieler-Schnitt</h2>`;
  if (!rows.length) h += '<p class="hint">Noch keine Spielerbewertungen.</p>';
  else {
    h += '<table><tr><th>Spieler</th><th>Trainer</th><th>Mannschaft</th></tr>';
    for (const p of rows) {
      const t = ta[p.id], m = pa[p.id];
      h += `<tr><td>${esc(p.name)}</td><td>${t ? f1(t.avg) + ` <span class="n">(${t.n})</span>` : '–'}</td><td>${m ? f1(m.avg) + ` <span class="n">(${m.n})</span>` : '–'}</td></tr>`;
    }
    h += '</table>';
  }
  h += '</div>';

  if ((res.reports || []).length) {
    h += `<div class="card"><h2>Spielberichte der Trainer</h2>`;
    for (const r of res.reports) h += `<div class="quote"><div class="by">${esc(r.name)} ${r.stars ? staticStars(r.stars) : ''}</div>${esc(r.note).replace(/\n/g, '<br>')}</div>`;
    h += '</div>';
  }
  if ((res.team_notes || []).length) {
    h += `<div class="card"><h2>Kommentare der Mannschaft</h2><p class="hint">Anonym</p>`;
    for (const n of res.team_notes) h += `<div class="quote">${esc(n)}</div>`;
    h += '</div>';
  }
  if ((res.self || []).length) {
    h += `<div class="card"><h2>Selbsteinschätzung der Spieler</h2>`;
    for (const s of res.self) h += `<div class="quote"><div class="by">${esc(nameOf(s.id))} ${s.stars ? staticStars(s.stars) : ''}</div>${esc(s.note || '')}</div>`;
    h += '</div>';
  }
  return h;
}

function render() {
  setHeader();
  renderChips();
  const r = detail.round;
  const mine = detail.mine;
  if (r.open && (editing || !mine)) return renderForm();
  $('bar').hidden = true;
  let h = '';
  if (r.open) {
    h += `<div class="card center"><div class="big">✅</div><h2>Deine Bewertung ist gespeichert</h2>
      <p class="hint">${mine.abstained ? 'Du hast „war nicht da“ angegeben.' : 'Sie zählt in den Trainer-Schnitt.'} Änderbar bis ${esc(fmtDate(r.closes_at, true))} Uhr.</p>
      <button class="btn ghost" id="edit">Bewertung ändern</button></div>`;
  } else {
    h += `<div class="card"><h2>Bewertung beendet</h2><p class="hint">${mine
      ? (mine.abstained ? 'Du warst als „nicht da“ eingetragen.' : `Deine Spielnote: ${mine.match_stars ? staticStars(mine.match_stars) : '–'}`)
      : 'Du hast für dieses Spiel nicht bewertet.'}</p></div>`;
  }
  h += resultsHtml();
  $('main').innerHTML = h;
  if ($('edit')) $('edit').onclick = () => { editing = true; render(); };
}

function renderForm() {
  const selfId = detail.self_player_id;
  const ps = players().filter((p) => p.id !== selfId);
  let h = `<div class="card"><label class="toggle"><input type="checkbox" id="abst" ${form.abstained ? 'checked' : ''}> War nicht da / bewerte nicht</label></div>`;
  h += `<div id="formBody" ${form.abstained ? 'hidden' : ''}>`;
  h += `<div class="card"><h2>Spiel-Gesamtnote</h2>${starsHtml('match', form.match_stars)}</div>`;
  h += `<div class="card"><h2>Spielbericht</h2><p class="hint">Sehen alle Trainer – mit deinem Namen.</p>
    <textarea id="note" maxlength="4000" placeholder="Dein Kommentar/Bericht zum Spiel …">${esc(form.note)}</textarea></div>`;
  h += `<div class="card"><h2>Spieler</h2><p class="hint">Alle Spieler mit Einsatz, 1–5 Sterne. Nochmal tippen nimmt die Note zurück.</p>`;
  for (const p of ps) {
    h += `<div class="row"><div class="who"><div class="num">${esc(p.number ?? '–')}</div><div class="name">${esc(p.name)}</div></div>${starsHtml('p:' + p.id, form.stars[p.id], true)}</div>`;
  }
  if (!ps.length) h += '<p class="hint">Keine Spieler in diesem Spiel.</p>';
  h += '</div></div>';
  if (detail.results) h += resultsHtml();
  $('main').innerHTML = h;
  $('bar').hidden = false;
  $('err').textContent = '';

  $('abst').onchange = (e) => { form.abstained = e.target.checked; $('formBody').hidden = form.abstained; };
  $('note').addEventListener('input', (e) => (form.note = e.target.value));
  $('main').querySelectorAll('.stars').forEach((el) => {
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      let v = Number(b.dataset.v);
      const key = el.dataset.key;
      const cur = key === 'match' ? form.match_stars : form.stars[key.slice(2)];
      if (cur === v) v = null;
      if (key === 'match') form.match_stars = v;
      else if (v == null) delete form.stars[key.slice(2)];
      else form.stars[key.slice(2)] = v;
      el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', v != null && Number(x.dataset.v) <= v));
    });
  });
}

async function send() {
  const empty = !form.abstained && form.match_stars == null && !form.note.trim() && Object.keys(form.stars).length === 0;
  if (empty) { $('err').textContent = 'Bitte gib mindestens eine Note ab oder wähle „War nicht da“.'; return; }
  $('send').disabled = true;
  $('err').textContent = '';
  try {
    const res = await rpc('coach_rating_submit', { p_token: token, p_match_id: sel, p: form });
    if (!res?.ok) {
      $('err').textContent = { closed: 'Die Bewertungsfrist ist abgelaufen.', invalid: 'Dieser Link ist nicht mehr gültig.', no_round: 'Für dieses Spiel gibt es keine Bewertung.' }[res?.error] || 'Speichern hat nicht geklappt.';
      return;
    }
    editing = false;
    await select(sel);
  } catch (e) {
    $('err').textContent = 'Keine Verbindung – bitte nochmal versuchen.';
  } finally {
    $('send').disabled = false;
  }
}

async function select(matchId) {
  sel = matchId;
  editing = false;
  try {
    detail = await rpc('coach_rating_detail', { p_token: token, p_match_id: matchId });
  } catch (e) {
    message('📶', 'Keine Verbindung', 'Bitte prüfe dein Internet und lade die Seite neu.');
    return;
  }
  if (!detail?.ok) { message('🚫', 'Nicht verfügbar', 'Dieses Spiel kann nicht geladen werden.'); return; }
  const m = detail.mine;
  form = m
    ? { stars: Object.fromEntries(Object.entries(m.stars || {}).map(([k, v]) => [k, Math.round(v)])),
        match_stars: m.match_stars != null ? Math.round(m.match_stars) : null, note: m.note || '', abstained: !!m.abstained }
    : { stars: {}, match_stars: null, note: '', abstained: false };
  render();
  window.scrollTo(0, 0);
}

async function load() {
  if (!token) { message('🔗', 'Link unvollständig', 'Bitte öffne deinen persönlichen Trainer-Link.'); $('sub').textContent = ''; return; }
  try {
    info = await rpc('coach_rating_rounds', { p_token: token });
  } catch (e) {
    $('sub').textContent = '';
    message('📶', 'Keine Verbindung', 'Bitte prüfe dein Internet und lade die Seite neu.');
    return;
  }
  if (!info?.ok) { info = null; $('sub').textContent = ''; message('🚫', 'Link ungültig', 'Dieser Link gilt nicht mehr. Lass dir in der App einen neuen erzeugen.'); return; }
  $('team').textContent = info.team || '';
  if (!(info.rounds || []).length) {
    $('sub').textContent = info.name ? `Hallo ${info.name}!` : '';
    message('⚽', 'Gerade nichts zu bewerten', 'Nach dem nächsten Spiel kannst du hier bewerten. Speichere dir den Link am besten als Lesezeichen.');
    return;
  }
  await select(info.rounds[0].match_id);
}

$('send').addEventListener('click', send);
window.addEventListener('hashchange', load);
load();
</script>
</body>
</html>
