<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a110e">
<title>Trainer-Bewertung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<div class="wrap">
  <div class="brand" id="brand">Trainer-Bewertung</div>
  <div id="me"></div>
  <div id="all"></div>
  <div id="tiles"></div>
  <div id="head"></div>
  <div id="main"><div class="card msg"><p>Wird geladen …</p></div></div>
</div>
<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="prog" id="prog"></div>
    <button class="btn" id="send">Bewertung speichern</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="common.js?v=13"></script>
<script>
const $ = (id) => document.getElementById(id);
let info = null;     // {name, team, rounds}
let sel = null;
let detail = null;   // coach_rating_detail
let med = {};        // rating_media
let logos = {};      // Gegnerlogos je Spiel (Kacheln)
let prof = null;     // rating_profile: Foto + eigene Abgaben
let ov = [];         // coach_overview: alle Spiele mit Abstimm-Stand
let votes = [];      // coach_votes: Trainer-Stimmen des gewählten Spiels
let editing = false;
let form = { stars: {}, match_stars: null, note: '', abstained: false, motm_player_id: null };
let month = null;    // coach_month: Rangliste + Gekürter
let monthSel = '';   // gewählter Monat (YYYY-MM), leer = Monat des Spiels

const players = () => CC.sortPlayers(detail?.round?.players).filter((p) => p.id !== detail?.self_player_id);
const byId = () => Object.fromEntries((detail?.round?.players || []).map((p) => [p.id, p]));

function header() {
  const logo = CC.safeImg(med.us?.logo);
  $('brand').innerHTML = (logo ? `<img src="${logo}" alt="">` : '') + CC.esc(info?.team || '') + ' · Trainer';
  $('me').innerHTML = CC.profileCard(prof, info?.name, `Trainer · ${info?.team || ''}`);
  $('tiles').innerHTML = CC.matchTiles(info?.rounds, sel, logos, med.us?.name, prof?.entries);
  const wasOpen = $('all').querySelector('details')?.open;
  $('all').innerHTML = CC.overviewList(ov, sel, logos, med.us?.name);
  if (wasOpen) $('all').querySelector('details').open = true;
  $('all').querySelectorAll('[data-og]').forEach((r) => (r.onclick = () => select(r.dataset.og)));
  $('tiles').querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => select(b.dataset.m)));
  const on = $('tiles').querySelector('.tile.on');
  if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  $('head').innerHTML = detail?.round ? CC.scoreboard(med, detail.round) : '';
}

function progress() {
  const n = players().length;
  const done = Object.keys(form.stars).length;
  $('prog').innerHTML = form.abstained ? '<span>Als „nicht da“ eintragen</span>'
    : (n ? `<span>${done}/${n} Spieler</span><div class="trk"><div style="width:${(done / n) * 100}%"></div></div><span>Note ${form.match_stars ? '✓' : '–'} · 👑 ${form.motm_player_id ? '✓' : '–'}</span>` : '');
}

function resultsHtml() {
  const res = detail.results;
  if (!res) return '';
  const ps = CC.sortPlayers(detail.round.players);
  const ids = byId();
  let h = `<div class="card"><h2 style="text-align:center">🏆 Spieler des Spiels</h2><p class="sub" style="text-align:center">Podest nach Sternen (${res.podium?.source === 'team' ? 'Mannschafts' : 'Trainer'}-Schnitt) · Gleichstand teilt den Platz</p>
    ${CC.starPodium(res.podium, ids, med.photos)}${CC.voteLine(res.motm, ids, med.photos)}<p class="voters">${res.voters} von ${ps.length} Spielern${res.motm_coaches ? ` + ${res.motm_coaches} ${res.motm_coaches === 1 ? 'Trainer' : 'Trainer'}` : ''} haben abgestimmt.</p></div>`;
  h += `<div class="card"><h2>Spielnote</h2><p class="sub">Schnitt der Gesamtnoten</p>${CC.gradeTiles([
    { cls: 't', label: 'Trainer', avg: res.trainer_match_avg, n: res.trainer_match_n },
    { cls: 'm', label: 'Mannschaft', avg: res.team_match_avg, n: res.team_match_n },
  ])}</div>`;
  const ta = res.trainer_avg || {}, pa = res.team_avg || {};
  const rows = ps.filter((p) => ta[p.id] || pa[p.id]).map((p) => ({ p, t: ta[p.id], m: pa[p.id] }))
    .sort((a, b) => (b.t?.avg ?? -1) - (a.t?.avg ?? -1) || (b.m?.avg ?? -1) - (a.m?.avg ?? -1));
  h += `<div class="card"><h2>Spieler-Schnitt</h2><p class="sub">Trainer und Mannschaft im Vergleich</p>${rows.length ? CC.bars(rows, med.photos) : '<p class="sub">Noch keine Spielerbewertungen.</p>'}</div>`;
  h += CC.coachVotesCard(votes, ids, med.photos, null);
  if ((res.reports || []).length) {
    h += '<div class="card"><h2>Spielberichte</h2>' + res.reports.map((r) =>
      `<div class="quote"><div class="by"><span>${CC.esc(r.name)}</span>${r.stars ? CC.stars(r.stars) : ''}</div>${CC.esc(r.note).replace(/\n/g, '<br>')}</div>`).join('') + '</div>';
  }
  if ((res.team_notes || []).length) {
    h += '<div class="card"><h2>Stimmen der Mannschaft</h2><p class="sub">Anonym</p>' +
      res.team_notes.map((n) => `<div class="quote">„${CC.esc(n)}“</div>`).join('') + '</div>';
  }
  if ((res.self || []).length) {
    h += '<div class="card"><h2>Selbsteinschätzung</h2>' + res.self.map((s) => {
      const p = ids[s.id] || { id: s.id, name: 'Unbekannt' };
      return `<div class="prow">${CC.avatar(p, med.photos)}<div class="nm">${CC.esc(p.name)}${s.note ? `<small>${CC.esc(s.note)}</small>` : ''}</div>${s.stars ? CC.stars(s.stars) : ''}</div>`;
    }).join('') + '</div>';
  }
  return h;
}

function render() {
  header();
  const r = detail.round;
  const mine = detail.mine;
  if (r.open && (editing || !mine)) return renderForm();
  $('bar').hidden = true;
  let h = '';
  if (r.open) {
    h += `<div class="card msg"><div class="check">✓</div><h2>Gespeichert</h2>
      <p>${mine.abstained ? 'Du bist als „nicht da“ eingetragen.' : 'Deine Noten zählen in den Trainer-Schnitt.'} Änderbar bis ${CC.esc(CC.fmtDate(r.closes_at, true))} Uhr.</p>
      <button class="btn ghost" id="edit">Bewertung ändern</button></div>`;
  } else {
    h += `<div class="card"><h2>Deine Bewertung</h2><p class="sub" style="margin:4px 0 0">${mine
      ? (mine.abstained ? 'Du warst als „nicht da“ eingetragen.' : `Deine Spielnote: ${mine.match_stars ? CC.stars(mine.match_stars) : '–'}`)
      : 'Du hast für dieses Spiel nicht bewertet.'}</p></div>`;
  }
  h += resultsHtml();
  h += '<div id="month"></div>';
  $('main').innerHTML = h;
  if ($('edit')) $('edit').onclick = () => { editing = true; render(); };
  renderMonth();
}

function renderForm() {
  const ps = players();
  let h = `<div class="card"><label class="switch"><span>War nicht da / bewerte nicht</span><input type="checkbox" id="abst" ${form.abstained ? 'checked' : ''}><span class="tr"></span></label></div>`;
  h += `<div id="formBody" ${form.abstained ? 'hidden' : ''}>`;
  h += `<div class="card"><h2>Spiel-Gesamtnote</h2><p class="sub">Deine Note für das ganze Spiel.</p>${CC.starsInput('match', form.match_stars, 'big')}</div>`;
  h += `<div class="card"><h2>Spielbericht</h2><p class="sub">Sehen alle Trainer – mit deinem Namen.</p>
    <textarea id="note" maxlength="4000" placeholder="Dein Kommentar/Bericht zum Spiel …">${CC.esc(form.note)}</textarea></div>`;
  h += `<div class="card"><h2>Spieler</h2><p class="sub">Alle mit Einsatz · nochmal tippen nimmt die Note zurück.</p>`;
  h += ps.length ? ps.map((p) => CC.playerRow(p, med.photos, 'p:' + p.id, form.stars[p.id])).join('') : '<p class="sub">Keine Spieler in diesem Spiel.</p>';
  h += '</div>';
  h += `<div class="card"><h2>Spieler des Spiels</h2><p class="sub">Deine Stimme – zählt zusammen mit der Mannschaft.</p>${CC.motmTiles(ps, med.photos, form.motm_player_id)}</div>`;
  h += '</div>';
  if (detail.results) h += resultsHtml();
  h += '<div id="month"></div>';
  $('main').innerHTML = h;
  renderMonth();
  $('main').querySelectorAll('[data-motm]').forEach((b) => {
    b.addEventListener('click', () => {
      form.motm_player_id = form.motm_player_id === b.dataset.motm ? null : b.dataset.motm;
      $('main').querySelectorAll('[data-motm]').forEach((x) => x.classList.toggle('on', x.dataset.motm === form.motm_player_id));
      progress();
    });
  });
  $('bar').hidden = false;
  $('err').textContent = '';
  progress();

  $('abst').onchange = (e) => { form.abstained = e.target.checked; $('formBody').hidden = form.abstained; progress(); };
  $('note').addEventListener('input', (e) => (form.note = e.target.value));
  CC.bindStars($('main'),
    (k) => (k === 'match' ? form.match_stars : form.stars[k.slice(2)]),
    (k, v) => {
      if (k === 'match') form.match_stars = v;
      else if (v == null) delete form.stars[k.slice(2)];
      else form.stars[k.slice(2)] = v;
      progress();
    });
}

function matchMonth() {
  const d = detail?.round?.match_date ? new Date(detail.round.match_date) : new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

async function loadMonth() {
  try {
    const m = await CC.rpc('coach_month', { p_token: CC.token, p_year_month: monthSel || matchMonth() });
    month = m?.ok ? m : null;
  } catch (e) {
    month = null;
  }
}

function renderMonth() {
  const el = $('month');
  if (!el || !month) return;
  const ym = month.year_month;
  const chips = (month.months || []).map((m) => `<button data-ym="${CC.esc(m)}" class="${m === ym ? 'on' : ''}">${CC.esc(CC.monthLabel(m, true))}</button>`).join('');
  el.innerHTML = CC.crownCard(month) +
    `<div class="card"><h2>Rangliste ${CC.esc(CC.monthLabel(ym))}</h2><p class="sub">Nach Trainer-Schnitt der Spiele im Monat · Mannschaft daneben. „Zustimmen“ = deine Stimme; gekürt ist erst, wenn alle Trainer denselben Spieler bestätigen.</p>
      <div class="mchips">${chips}</div>${CC.rankList(month.ranking, month.crown?.crowned, month.crown, month.me)}
      ${(month.history || []).length ? `<h2 style="margin-top:16px;font-size:17px">Bisherige Spieler des Monats</h2>${CC.historyStrip(month.history)}` : ''}</div>`;
  el.querySelectorAll('[data-ym]').forEach((b) => (b.onclick = async () => { monthSel = b.dataset.ym; await loadMonth(); renderMonth(); }));
  el.querySelectorAll('[data-crown]').forEach((b) => (b.onclick = async () => {
    const id = b.dataset.crown;
    const undo = b.dataset.mine === '1';
    b.disabled = true;
    try {
      const res = await CC.rpc('coach_crown_vote', { p_token: CC.token, p_year_month: ym, p_player_id: undo ? null : id });
      if (!res?.ok) alert('Zustimmen hat nicht geklappt.');
    } catch (e) {
      alert('Keine Verbindung – bitte nochmal versuchen.');
    }
    monthSel = ym;
    await loadMonth();
    renderMonth();
  }));
}

async function send() {
  const empty = !form.abstained && form.match_stars == null && !form.note.trim() && Object.keys(form.stars).length === 0 && !form.motm_player_id;
  if (empty) { $('err').textContent = 'Bitte gib mindestens eine Note ab oder wähle „War nicht da“.'; return; }
  $('send').disabled = true;
  $('err').textContent = '';
  try {
    const res = await CC.rpc('coach_rating_submit', { p_token: CC.token, p_match_id: sel, p: form });
    if (!res?.ok) {
      $('err').textContent = { closed: 'Die Bewertungsfrist ist abgelaufen.', invalid: 'Dieser Link ist nicht mehr gültig.', no_round: 'Für dieses Spiel gibt es keine Bewertung.' }[res?.error] || 'Speichern hat nicht geklappt.';
      return;
    }
    editing = false;
    prof = (await CC.profile()) || prof;
    ov = await CC.rpc('coach_overview', { p_token: CC.token }).then((o) => (o?.ok ? o.games || [] : ov)).catch(() => ov);
    await select(sel);
  } catch (e) {
    $('err').textContent = 'Keine Verbindung – bitte nochmal versuchen.';
  } finally {
    $('send').disabled = false;
  }
}

async function select(matchId) {
  sel = matchId;
  editing = false;
  let d, m, cv;
  try {
    [d, m, cv] = await Promise.all([
      CC.rpc('coach_rating_detail', { p_token: CC.token, p_match_id: matchId }),
      CC.media(matchId),
      CC.rpc('coach_votes', { p_token: CC.token, p_match_id: matchId }).catch(() => null),
    ]);
  } catch (e) {
    CC.message($('main'), '📶', 'Keine Verbindung', 'Bitte prüfe dein Internet und lade die Seite neu.');
    return;
  }
  if (!d?.ok) { CC.message($('main'), '🚫', 'Nicht verfügbar', 'Dieses Spiel kann nicht geladen werden.'); return; }
  detail = d;
  med = m;
  votes = cv?.ok && !cv.locked ? cv.votes || [] : [];
  if (m.logos) logos = m.logos;
  const mine = d.mine;
  form = mine
    ? { stars: Object.fromEntries(Object.entries(mine.stars || {}).map(([k, v]) => [k, Number(v)])),
        match_stars: mine.match_stars != null ? Number(mine.match_stars) : null, note: mine.note || '', abstained: !!mine.abstained,
        motm_player_id: mine.motm_player_id || null }
    : { stars: {}, match_stars: null, note: '', abstained: false, motm_player_id: null };
  await loadMonth();
  render();
  window.scrollTo(0, 0);
}

async function load() {
  if (!CC.token) { CC.message($('main'), '🔗', 'Link unvollständig', 'Bitte öffne deinen persönlichen Trainer-Link.'); return; }
  try {
    info = await CC.rpc('coach_rating_rounds', { p_token: CC.token });
  } catch (e) {
    CC.message($('main'), '📶', 'Keine Verbindung', 'Bitte prüfe dein Internet und lade die Seite neu.');
    return;
  }
  if (!info?.ok) { info = null; CC.message($('main'), '🚫', 'Link ungültig', 'Dieser Link gilt nicht mehr. Lass dir in der App einen neuen erzeugen.'); return; }
  [prof, ov] = await Promise.all([
    CC.profile(),
    CC.rpc('coach_overview', { p_token: CC.token }).then((o) => (o?.ok ? o.games || [] : [])).catch(() => []),
  ]);
  if (!(info.rounds || []).length) {
    med = await CC.media('');
    header();
    CC.message($('main'), '⚽', 'Gerade nichts zu bewerten', 'Nach dem nächsten Spiel kannst du hier bewerten. Speichere dir den Link am besten als Lesezeichen.');
    return;
  }
  await select(info.rounds[0].match_id);
}

$('send').addEventListener('click', send);
window.addEventListener('hashchange', () => location.reload());
load();
</script>
</body>
</html>
