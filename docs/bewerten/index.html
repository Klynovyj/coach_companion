<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Spielbewertung</title>
<style>
  :root {
    --green: #138a54;
    --green-dark: #0c5c38;
    --bg: #f3f6f4;
    --card: #ffffff;
    --text: #1b2420;
    --muted: #5d6b64;
    --line: #dfe6e2;
    --star: #f2b233;
    --star-off: #cfd8d3;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513;
      --card: #1a211e;
      --text: #e8efeb;
      --muted: #9aa8a1;
      --line: #2b3530;
      --star-off: #3b4741;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--green); color: #fff; padding: 18px 16px 22px; }
  header .team { font-size: 13px; opacity: .85; letter-spacing: .04em; text-transform: uppercase; }
  header h1 { margin: 4px 0 2px; font-size: 21px; line-height: 1.25; }
  header .sub { font-size: 14px; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 96px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 14px 12px; margin: 12px 0; }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .stars { display: flex; gap: 2px; }
  .stars button { background: none; border: 0; padding: 4px; font-size: 30px; line-height: 1;
    color: var(--star-off); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .stars button.on { color: var(--star); }
  .stars.small button { font-size: 26px; padding: 3px; }
  textarea { width: 100%; min-height: 64px; margin-top: 8px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--green);
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .motm { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .motm button { text-align: left; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
  .motm button.on { border-color: var(--green); background: var(--green); color: #fff; font-weight: 600; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--line); }
  .bar button, .btn { display: block; width: 100%; max-width: 560px; margin: 0 auto; padding: 14px;
    border: 0; border-radius: 12px; background: var(--green); color: #fff; font: 600 17px system-ui, sans-serif; cursor: pointer; }
  .bar button:disabled { opacity: .6; }
  .btn.ghost { background: transparent; color: var(--green); border: 1px solid var(--green); margin-top: 10px; }
  .center { text-align: center; padding: 28px 8px; }
  .big { font-size: 46px; }
  .err { color: var(--danger); font-size: 14px; margin-top: 8px; text-align: center; }
  .winner { font-size: 22px; font-weight: 700; margin: 6px 0 2px; }
</style>
</head>
<body>
<header>
  <div class="team" id="team">&nbsp;</div>
  <h1 id="title">Spielbewertung</h1>
  <div class="sub" id="sub">Wird geladen …</div>
</header>
<main id="main"></main>
<div class="bar" id="bar" hidden><button id="send">Abschicken</button><div class="err" id="err"></div></div>

<script>
const SUPABASE_URL = 'https://ujrpsqfekmmjxypsdyza.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqcnBzcWZla21tanh5cHNkeXphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MjQwNDIsImV4cCI6MjEwODQwMDA0Mn0.37Ht9fqrnmIqS23qNNM81zRr-zPFc8K6pjiUMmUmvFg';

const token = new URLSearchParams(location.hash.slice(1)).get('t') ||
  new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
let state = null;
let form = { stars: {}, self_stars: null, self_note: '', match_stars: null, match_note: '', motm_player_id: null };

async function rpc(fn, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDate(iso, withTime) {
  if (!iso) return '';
  const d = new Date(iso);
  const opts = { weekday: 'short', day: '2-digit', month: '2-digit' };
  if (withTime) Object.assign(opts, { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleString('de-DE', opts);
}

function sortedPlayers() {
  const ps = (state.round?.players || []).slice();
  ps.sort((a, b) => (a.number ?? 999) - (b.number ?? 999) || String(a.name).localeCompare(String(b.name)));
  return ps;
}

function starsHtml(key, value, small) {
  let h = `<div class="stars${small ? ' small' : ''}" data-key="${esc(key)}" role="radiogroup">`;
  for (let i = 1; i <= 5; i++) {
    h += `<button type="button" data-v="${i}" class="${value >= i ? 'on' : ''}" aria-label="${i} Sterne">★</button>`;
  }
  return h + '</div>';
}

function setHeader() {
  $('team').textContent = state?.team || '';
  const r = state?.round;
  if (r) {
    $('title').textContent = r.title || 'Spielbewertung';
    $('sub').textContent = r.open
      ? `Hallo ${state.player_name || ''}! Bewerten bis ${fmtDate(r.closes_at, true)} Uhr`
      : `Spiel vom ${fmtDate(r.match_date)} · Bewertung beendet`;
  } else {
    $('title').textContent = 'Spielbewertung';
    $('sub').textContent = state?.player_name ? `Hallo ${state.player_name}!` : '';
  }
}

function renderMessage(icon, title, text) {
  $('bar').hidden = true;
  $('main').innerHTML = `<div class="card center"><div class="big">${icon}</div><h2>${esc(title)}</h2><p class="hint">${esc(text)}</p></div>`;
}

function renderClosed() {
  $('bar').hidden = true;
  const byId = Object.fromEntries((state.round.players || []).map((p) => [p.id, p]));
  const motm = state.motm || [];
  let h = '<div class="card center"><div class="big">🏆</div><h2>Spieler des Spiels</h2>';
  if (motm.length === 0) {
    h += '<p class="hint">Es wurde kein Spieler des Spiels gewählt.</p>';
  } else {
    for (const m of motm) h += `<div class="winner">${esc(byId[m.id]?.name || 'Unbekannt')}</div>`;
    const v = motm[0].votes;
    h += `<p class="hint">${v} ${v === 1 ? 'Stimme' : 'Stimmen'}${motm.length > 1 ? ' – geteilter Platz' : ''}</p>`;
  }
  h += '</div><p class="hint" style="text-align:center">Nach dem nächsten Spiel kannst du hier wieder bewerten. Speichere dir den Link am besten als Lesezeichen.</p>';
  $('main').innerHTML = h;
}

function renderThanks() {
  $('bar').hidden = true;
  $('main').innerHTML = `<div class="card center"><div class="big">✅</div><h2>Danke für deine Bewertung!</h2>
    <p class="hint">Du kannst sie bis ${esc(fmtDate(state.round.closes_at, true))} Uhr noch ändern. Den Spieler des Spiels siehst du hier nach Ablauf der Frist.</p>
    <button class="btn ghost" id="edit">Bewertung ändern</button></div>`;
  $('edit').onclick = renderForm;
}

function renderForm() {
  const me = state.player_id;
  const mates = sortedPlayers().filter((p) => p.id !== me);
  let h = '';
  h += `<div class="card"><h2>Wie lief das Spiel?</h2><p class="hint">Deine Note für die ganze Mannschaft.</p>
    ${starsHtml('match', form.match_stars)}
    <textarea id="match_note" maxlength="1000" placeholder="Was lief gut, was nicht? (optional)">${esc(form.match_note)}</textarea></div>`;
  h += `<div class="card"><h2>Deine Leistung</h2><p class="hint">Ehrlich einschätzen – sieht nur das Trainerteam.</p>
    ${starsHtml('self', form.self_stars)}
    <textarea id="self_note" maxlength="1000" placeholder="Kommentar zu deinem Spiel (optional)">${esc(form.self_note)}</textarea></div>`;
  h += `<div class="card"><h2>Deine Mitspieler</h2><p class="hint">Anonym: Das Trainerteam sieht nur den Schnitt, nicht wer welche Note gab.</p>`;
  for (const p of mates) {
    h += `<div class="row"><div class="who"><div class="num">${esc(p.number ?? '–')}</div><div class="name">${esc(p.name)}</div></div>${starsHtml('p:' + p.id, form.stars[p.id], true)}</div>`;
  }
  if (mates.length === 0) h += '<p class="hint">Keine Mitspieler in diesem Spiel.</p>';
  h += '</div>';
  h += `<div class="card"><h2>Spieler des Spiels</h2><p class="hint">Wer war heute der Beste? (eine Stimme)</p><div class="motm">`;
  for (const p of mates) {
    h += `<button type="button" data-motm="${esc(p.id)}" class="${form.motm_player_id === p.id ? 'on' : ''}">${esc(p.number != null ? p.number + ' · ' : '')}${esc(p.name)}</button>`;
  }
  h += '</div></div>';
  $('main').innerHTML = h;
  $('bar').hidden = false;
  $('err').textContent = '';

  $('main').querySelectorAll('.stars').forEach((el) => {
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      let v = Number(b.dataset.v);
      const key = el.dataset.key;
      const cur = key === 'match' ? form.match_stars : key === 'self' ? form.self_stars : form.stars[key.slice(2)];
      if (cur === v) v = null; // nochmal tippen = zurücknehmen
      if (key === 'match') form.match_stars = v;
      else if (key === 'self') form.self_stars = v;
      else if (v == null) delete form.stars[key.slice(2)];
      else form.stars[key.slice(2)] = v;
      el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', v != null && Number(x.dataset.v) <= v));
    });
  });
  $('main').querySelectorAll('[data-motm]').forEach((b) => {
    b.addEventListener('click', () => {
      form.motm_player_id = form.motm_player_id === b.dataset.motm ? null : b.dataset.motm;
      $('main').querySelectorAll('[data-motm]').forEach((x) => x.classList.toggle('on', x.dataset.motm === form.motm_player_id));
    });
  });
  $('match_note').addEventListener('input', (e) => (form.match_note = e.target.value));
  $('self_note').addEventListener('input', (e) => (form.self_note = e.target.value));
}

async function send() {
  const empty = form.match_stars == null && form.self_stars == null && !form.motm_player_id &&
    Object.keys(form.stars).length === 0 && !form.match_note.trim() && !form.self_note.trim();
  if (empty) {
    $('err').textContent = 'Bitte gib mindestens eine Bewertung ab.';
    return;
  }
  $('send').disabled = true;
  $('err').textContent = '';
  try {
    const res = await rpc('peer_rating_submit', { p_token: token, p_match_id: state.round.match_id, p: form });
    if (!res?.ok) {
      const msg = { closed: 'Die Bewertungsfrist ist leider abgelaufen.', invalid: 'Dieser Link ist nicht mehr gültig.',
        not_in_round: 'Du stehst nicht in der Liste für dieses Spiel.', no_round: 'Für dieses Spiel gibt es keine Bewertung.' }[res?.error];
      $('err').textContent = msg || 'Speichern hat nicht geklappt.';
      if (res?.error === 'closed') setTimeout(load, 1500);
      return;
    }
    renderThanks();
  } catch (e) {
    $('err').textContent = 'Keine Verbindung – bitte nochmal versuchen.';
  } finally {
    $('send').disabled = false;
  }
}

async function load() {
  if (!token) {
    setHeader();
    renderMessage('🔗', 'Link unvollständig', 'Bitte öffne deinen persönlichen Link aus der Nachricht deines Trainers.');
    return;
  }
  try {
    state = await rpc('peer_rating_state', { p_token: token });
  } catch (e) {
    $('sub').textContent = '';
    renderMessage('📶', 'Keine Verbindung', 'Bitte prüfe dein Internet und lade die Seite neu.');
    return;
  }
  if (!state?.ok) {
    state = null;
    setHeader();
    renderMessage('🚫', 'Link ungültig', 'Dieser Link gilt nicht mehr. Frag dein Trainerteam nach deinem neuen Link.');
    return;
  }
  setHeader();
  const r = state.round;
  if (!r) {
    renderMessage('⚽', 'Gerade nichts zu bewerten', 'Nach dem nächsten Spiel kannst du hier deine Bewertung abgeben. Speichere dir den Link am besten als Lesezeichen.');
    return;
  }
  if (!r.open) { renderClosed(); return; }
  const m = state.mine;
  if (m) {
    form = {
      stars: Object.assign({}, m.stars || {}),
      self_stars: m.self_stars ?? null,
      self_note: m.self_note || '',
      match_stars: m.match_stars ?? null,
      match_note: m.match_note || '',
      motm_player_id: m.motm_player_id || null,
    };
    renderThanks();
  } else {
    renderForm();
  }
}

$('send').addEventListener('click', send);
window.addEventListener('hashchange', load);
load();
</script>
</body>
</html>
