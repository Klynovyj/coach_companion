<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a110e">
<title>Spielbewertung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="wrap">
  <div class="brand" id="brand">Spielbewertung</div>
  <div id="head"></div>
  <div id="main"><div class="card msg"><p>Wird geladen …</p></div></div>
</div>
<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="prog" id="prog"></div>
    <button class="btn" id="send">Bewertung abschicken</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="common.js?v=4"></script>
<script>
const $ = (id) => document.getElementById(id);
let state = null;
let med = {};
let prof = null;     // rating_profile: Foto + eigene Abgaben
let form = { stars: {}, self_stars: null, self_note: '', match_stars: null, match_note: '', motm_player_id: null };

const mates = () => CC.sortPlayers(state.round.players).filter((p) => p.id !== state.player_id);
const byId = () => Object.fromEntries((state.round.players || []).map((p) => [p.id, p]));

function brand() {
  const logo = CC.safeImg(med.us?.logo);
  $('brand').innerHTML = (logo ? `<img src="${logo}" alt="">` : '') + CC.esc(state?.team || 'Spielbewertung');
}

function header() {
  brand();
  const r = state?.round;
  $('head').innerHTML = CC.profileCard(prof, state?.player_name, `Spieler · ${state?.team || ''}`) +
    (r ? CC.scoreboard(med, r) : '');
}

function progress() {
  const n = mates().length;
  const done = Object.keys(form.stars).length;
  $('prog').innerHTML = n ? `<span>${done}/${n} Mitspieler</span><div class="trk"><div style="width:${(done / n) * 100}%"></div></div>` +
    `<span>${form.motm_player_id ? '👑 gewählt' : '👑 offen'}</span>` : '';
}

function renderForm() {
  const ms = mates();
  let h = '';
  h += `<div class="card"><h2>Wie lief das Spiel?</h2><p class="sub">Deine Note für die ganze Mannschaft.</p>
    ${CC.starsInput('match', form.match_stars, 'big')}
    <textarea id="match_note" maxlength="1000" placeholder="Was lief gut, was nicht? (optional)">${CC.esc(form.match_note)}</textarea></div>`;
  h += `<div class="card"><h2>Deine Leistung</h2><p class="sub">Ehrlich einschätzen – sieht nur das Trainerteam.</p>
    ${CC.starsInput('self', form.self_stars, 'big')}
    <textarea id="self_note" maxlength="1000" placeholder="Kommentar zu deinem Spiel (optional)">${CC.esc(form.self_note)}</textarea></div>`;
  h += `<div class="card"><h2>Deine Mitspieler</h2><p class="sub">Anonym – das Trainerteam sieht nur den Schnitt.</p>`;
  h += ms.length ? ms.map((p) => CC.playerRow(p, med.photos, 'p:' + p.id, form.stars[p.id])).join('') : '<p class="sub">Keine Mitspieler in diesem Spiel.</p>';
  h += '</div>';
  h += `<div class="card"><h2>Spieler des Spiels</h2><p class="sub">Wer war heute der Beste? Eine Stimme.</p>${CC.motmTiles(ms, med.photos, form.motm_player_id)}</div>`;
  $('main').innerHTML = h;
  $('bar').hidden = false;
  $('err').textContent = '';
  progress();

  CC.bindStars($('main'),
    (k) => (k === 'match' ? form.match_stars : k === 'self' ? form.self_stars : form.stars[k.slice(2)]),
    (k, v) => {
      if (k === 'match') form.match_stars = v;
      else if (k === 'self') form.self_stars = v;
      else if (v == null) delete form.stars[k.slice(2)];
      else form.stars[k.slice(2)] = v;
      progress();
    });
  $('main').querySelectorAll('[data-motm]').forEach((b) => {
    b.addEventListener('click', () => {
      form.motm_player_id = form.motm_player_id === b.dataset.motm ? null : b.dataset.motm;
      $('main').querySelectorAll('[data-motm]').forEach((x) => x.classList.toggle('on', x.dataset.motm === form.motm_player_id));
      progress();
    });
  });
  $('match_note').addEventListener('input', (e) => (form.match_note = e.target.value));
  $('self_note').addEventListener('input', (e) => (form.self_note = e.target.value));
}

function renderThanks() {
  $('bar').hidden = true;
  const motm = form.motm_player_id ? byId()[form.motm_player_id] : null;
  $('main').innerHTML = `<div class="card msg"><div class="check">✓</div><h2>Danke!</h2>
    <p>Deine Bewertung ist gespeichert. Du kannst sie bis ${CC.esc(CC.fmtDate(state.round.closes_at, true))} Uhr noch ändern.</p>
    ${motm ? `<p style="margin-top:10px">Dein Spieler des Spiels: <b style="color:var(--gold)">${CC.esc(motm.name)}</b></p>` : ''}
    <p style="margin-top:10px">Wer Spieler des Spiels geworden ist, siehst du hier nach Ablauf der Frist.</p>
    <button class="btn ghost" id="edit">Bewertung ändern</button></div>` + CC.entriesCard(prof, med.logos, med.us?.name);
  $('edit').onclick = renderForm;
}

function renderClosed() {
  $('bar').hidden = true;
  $('main').innerHTML = `<div class="card"><h2 style="text-align:center">🏆 Spieler des Spiels</h2>${CC.podium(state.motm || [], byId(), med.photos)}</div>
    <p class="hello" style="text-align:center">Nach dem nächsten Spiel kannst du hier wieder bewerten. Speichere dir den Link am besten als Lesezeichen.</p>` + CC.entriesCard(prof, med.logos, med.us?.name);
}

async function send() {
  const empty = form.match_stars == null && form.self_stars == null && !form.motm_player_id &&
    Object.keys(form.stars).length === 0 && !form.match_note.trim() && !form.self_note.trim();
  if (empty) { $('err').textContent = 'Bitte gib mindestens eine Bewertung ab.'; return; }
  $('send').disabled = true;
  $('err').textContent = '';
  try {
    const res = await CC.rpc('peer_rating_submit', { p_token: CC.token, p_match_id: state.round.match_id, p: form });
    if (!res?.ok) {
      $('err').textContent = { closed: 'Die Bewertungsfrist ist leider abgelaufen.', invalid: 'Dieser Link ist nicht mehr gültig.',
        not_in_round: 'Du stehst nicht in der Liste für dieses Spiel.', no_round: 'Für dieses Spiel gibt es keine Bewertung.' }[res?.error] || 'Speichern hat nicht geklappt.';
      if (res?.error === 'closed') setTimeout(load, 1500);
      return;
    }
    prof = (await CC.profile()) || prof;
    header();
    renderThanks();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    $('err').textContent = 'Keine Verbindung – bitte nochmal versuchen.';
  } finally {
    $('send').disabled = false;
  }
}

async function load() {
  if (!CC.token) { CC.message($('main'), '🔗', 'Link unvollständig', 'Bitte öffne deinen persönlichen Link aus der Nachricht deines Trainers.'); return; }
  try {
    state = await CC.rpc('peer_rating_state', { p_token: CC.token });
  } catch (e) {
    CC.message($('main'), '📶', 'Keine Verbindung', 'Bitte prüfe dein Internet und lade die Seite neu.');
    return;
  }
  if (!state?.ok) {
    state = null;
    CC.message($('main'), '🚫', 'Link ungültig', 'Dieser Link gilt nicht mehr. Frag dein Trainerteam nach deinem neuen Link.');
    return;
  }
  const r = state.round;
  [med, prof] = await Promise.all([CC.media(r?.match_id), CC.profile()]);
  header();
  if (!r) { CC.message($('main'), '⚽', 'Gerade nichts zu bewerten', 'Nach dem nächsten Spiel kannst du hier deine Bewertung abgeben. Speichere dir den Link am besten als Lesezeichen.'); return; }
  if (!r.open) { renderClosed(); return; }
  const m = state.mine;
  if (m) {
    form = { stars: Object.assign({}, m.stars || {}), self_stars: m.self_stars ?? null, self_note: m.self_note || '',
      match_stars: m.match_stars ?? null, match_note: m.match_note || '', motm_player_id: m.motm_player_id || null };
    renderThanks();
  } else {
    renderForm();
  }
}

$('send').addEventListener('click', send);
window.addEventListener('hashchange', () => location.reload());
load();
</script>
</body>
</html>
