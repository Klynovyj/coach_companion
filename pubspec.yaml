name: coach_companion
description: "Trainer-App: Kader & Spielplan via FuPa-Import, Gegner-Sync und Live-Spielerfassung für beide Mannschaften."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Lokale Datenbank (SQLite, inkl. Desktop via FFI)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.4

  # HTTP (für genehmigte Datenquellen)
  http: ^1.2.2

  # Utilities
  uuid: ^4.4.2
  intl: ^0.20.2

  # FuPa-Link im Browser öffnen
  url_launcher: ^6.3.0
  flutter_quill: 11.4.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
