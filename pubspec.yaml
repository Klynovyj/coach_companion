name: coach_companion
description: "Trainer-App: Kader & Spielplan via FuPa-Import, Gegner-Sync und Live-Spielerfassung für beide Mannschaften."
publish_to: 'none'
version: 1.3.16+21

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Lokale Datenbank (SQLite, inkl. Desktop via FFI)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.4

  # HTTP (für genehmigte Datenquellen)
  http: ^1.2.2

  # Utilities
  uuid: ^4.4.2
  intl: ^0.20.2

  # FuPa-Link im Browser öffnen
  url_launcher: ^6.3.0
  flutter_quill: 11.4.0
  share_plus: ^12.0.2

  # Spielerfoto wählen (Galerie/Datei; am Handy auch Kamera)
  image_picker: ^1.1.2
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^22.3.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  package_info_plus: ^9.0.1
  open_filex: ^5.0.0
  supabase_flutter: ^2.18.3

  # Push-Benachrichtigungen (FCM) – nur Android
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# App-Icon (myCoach) für Android & Windows generieren:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  min_sdk_android: 21
  adaptive_icon_background: "#138A54"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/tray_icon.ico
