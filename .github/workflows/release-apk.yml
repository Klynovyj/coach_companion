name: Release APK

# Baut die signierte Release-APK auf einem Linux-Runner (lokal scheitert der
# Android-Build an JDK-Loopback/VMware) und veröffentlicht sie als GitHub-
# Release. Die App prüft version.json und lädt dann
# releases/latest/download/app-release.apk.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optionaler Tag-Name (sonst aus pubspec-Version)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Signatur aus Secrets einrichten
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PW
          keyPassword=$KEY_PW
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Release-APK bauen
        run: flutter build apk --release

      - name: Tag + Version bestimmen
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION/+/-}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: GitHub-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "myCoach ${{ steps.meta.outputs.version }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
